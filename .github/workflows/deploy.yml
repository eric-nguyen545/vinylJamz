name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Runs the Firestore rules against the local emulator. Not required for deploy yet: once you've seen
  # it pass, add `rules-tests` to the `needs` list of the deploy job to make it a gate.
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify Firebase configuration
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || (echo "Missing API KEY" && exit 1)
          test -n "$VITE_FIREBASE_AUTH_DOMAIN" || (echo "Missing AUTH DOMAIN" && exit 1)
          test -n "$VITE_FIREBASE_PROJECT_ID" || (echo "Missing PROJECT ID" && exit 1)
          test -n "$VITE_FIREBASE_APP_ID" || (echo "Missing APP ID" && exit 1)
          echo "Firebase configuration variables are present."
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - name: Verify owner UID
        run: |
          if [ "$VITE_OWNER_UID" = "e33PlwhcRycrTeCKYCp57POmMfq1" ]; then
            echo "SUCCESS: Owner UID matches."
          else
            echo "ERROR: Owner UID is missing or incorrect."
            exit 1
          fi
        env:
          VITE_OWNER_UID: ${{ vars.VITE_OWNER_UID }}
      - run: npm run build
        env:
          # Public client config (not secrets). Set these as repository Variables.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_OWNER_UID: ${{ vars.VITE_OWNER_UID }}
          VITE_APP_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}
          VITE_ENABLE_CSP: ${{ vars.VITE_ENABLE_CSP }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [build, rules-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
